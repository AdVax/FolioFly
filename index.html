<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FolioFly — منشئ السير الذاتية</title>
<link rel="stylesheet" href="style.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">Folio<span>Fly</span></div>
    <button class="icon-btn" id="backBtn" style="display:none;" title="رجوع">→</button>
  </header>
  <main id="main"></main>
</div>

<!-- Preview / PDF modal -->
<div class="modal-overlay" id="previewOverlay">
  <div class="modal-sheet">
    <div class="modal-header">
      <strong>معاينة السيرة</strong>
      <button id="closePreview">×</button>
    </div>
    <div class="modal-body">
      <div id="resume-paper"></div>
    </div>
    <div class="bottom-bar" style="position:static; background:none; border:none;">
      <button class="btn-pdf" id="exportPdfBtn" style="width:100%;">تحميل PDF</button>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmText">هل أنت متأكد من الحذف؟ لا يمكن التراجع عن هذا الإجراء.</p>
    <div class="confirm-actions">
      <button class="cancel" id="confirmCancel">إلغاء</button>
      <button class="confirm" id="confirmOk">حذف</button>
    </div>
  </div>
</div>

<script src="templates.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
